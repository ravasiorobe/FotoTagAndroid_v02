name: FotoTag - test e APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test JPEG e XMP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/check
          javac -d build/check app/src/main/java/it/fototag/app/JpegXmpEditor.java tests/JpegXmpEditorTest.java
          java -cp build/check JpegXmpEditorTest

      - name: Verifica Android SDK preinstallato
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35'
          test -d "$ANDROID_HOME/build-tools/35.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0'

      - name: Configura Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK Android
        shell: bash
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoTag-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
